<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PDF Compressor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial; background: #f4f6f9; padding: 2rem; }
    .container { max-width: 600px; margin: auto; background: #fff; padding: 2rem; border-radius: 1rem; box-shadow: 0 0 10px #ccc; }
    h1 { text-align: center; }
    input[type="file"], input[type="range"], button { width: 100%; margin-top: 1rem; }
    table { width: 100%; margin-top: 2rem; border-collapse: collapse; }
    th, td { border: 1px solid #ccc; padding: 0.5rem; text-align: center; }
    th { background: #e0f0ff; }
  </style>
</head>
<body>
  <div class="container">
    <h1>PDF Compressor 🗜️</h1>
    <input type="file" id="pdfFile" accept="application/pdf">
    <label for="compressLevel">Compression Level: <span id="levelDisplay">50%</span></label>
    <input type="range" id="compressLevel" min="10" max="90" value="50">
    <button onclick="compressPDF()">Compress PDF</button>

    <table id="resultTable" style="display: none;">
      <thead><tr><th>File</th><th>Original</th><th>Compressed</th><th>Download</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    const levelSlider = document.getElementById('compressLevel');
    levelSlider.oninput = () => {
      document.getElementById('levelDisplay').textContent = levelSlider.value + '%';
    };

    async function compressPDF() {
      const file = document.getElementById('pdfFile').files[0];
      const level = document.getElementById('compressLevel').value;
      if (!file) return alert('Select a PDF file.');

      const formData = new FormData();
      formData.append('pdf', file);
      formData.append('level', level);

      const res = await fetch('/compress', { method: 'POST', body: formData });
      const data = await res.json();
      if (!data.success) return alert('Compression failed.');

      document.getElementById('resultTable').style.display = 'table';
      document.querySelector('#resultTable tbody').innerHTML = `
        <tr>
          <td>${data.fileName}</td>
          <td>${(data.originalSize / 1024).toFixed(1)} KB</td>
          <td>${(data.compressedSize / 1024).toFixed(1)} KB</td>
          <td><a href="${data.url}" target="_blank">⬇️</a></td>
        </tr>
      `;
    }
  </script>
</body>
</html>
